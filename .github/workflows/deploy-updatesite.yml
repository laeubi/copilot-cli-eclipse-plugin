# Build documentation and p2 update site, then publish both to GitHub Pages
name: Build and Deploy to GitHub Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean verify

      - name: Install pandoc
        run: sudo apt-get install -y pandoc

      - name: Prepare site
        run: |
          mkdir -p _site/repository

          # Copy p2 repository content into the /repository sub-path so that the
          # update-site URL becomes:  https://<owner>.github.io/<repo>/repository/
          cp -r releng/io.github.laeubi.copilot.cli.repository/target/repository/. _site/repository/

          # Convert README.md → index.html (GitHub-flavoured Markdown → HTML5)
          pandoc README.md \
            --from gfm \
            --to html5 \
            --standalone \
            --metadata title="GitHub Copilot CLI Eclipse Plugin" \
            -o _site/index.html

          # Convert ADDITIONAL_TOOLS.md → additional-tools.html
          pandoc ADDITIONAL_TOOLS.md \
            --from gfm \
            --to html5 \
            --standalone \
            --metadata title="Additional MCP Tools – GitHub Copilot CLI Eclipse Plugin" \
            -o _site/additional-tools.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
